name: CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

jobs:
  backend:
    name: backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev --python 3.12

      # Full-repo lint/type cleanup is a tracked follow-up: app/,migrations/,
      # seeds/ carry hundreds of pre-existing violations. Today the gate
      # covers the test core (strict) and runs the whole pytest suite.
      - name: Ruff (tests)
        run: uv run ruff check tests

      - name: Mypy (tests, strict; legacy app tolerated via pyproject overrides)
        run: uv run mypy tests

      # No real Postgres/Redis/network: conftest mounts in-memory SQLite and
      # integration-marked tests skip unless PILGRIM_RUN_INTEGRATION=1.
      - name: Pytest
        run: uv run pytest -q

  # Real-PostgreSQL gate: SQLite (unit suite) stores enums as VARCHAR, so
  # enum label drift between the alembic migrations and the SQLAlchemy models
  # (e.g. proxy_health_status_enum "HEALTHY" vs "healthy") is invisible there.
  integration:
    name: integration (postgres + alembic head)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pilgrim
          POSTGRES_PASSWORD: pilgrim
          POSTGRES_DB: pilgrim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilgrim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pilgrim:pilgrim@localhost:5432/pilgrim
      REDIS_URL: redis://localhost:6379/0
      PILGRIM_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev --python 3.12

      - name: Alembic upgrade head (fresh database)
        run: uv run alembic upgrade head

      - name: Integration tests (real PostgreSQL)
        run: uv run pytest -q tests/test_integration_postgres.py
